[pytest]
pythonpath = .
testpaths = tests
markers =
    golden: end-to-end claims through the real model (needs models/ and data/mvtec/)
    eval: CV metric thresholds (needs reports/raw/)
    live: calls the real Nebius LLM (needs NEBIUS_API_KEY)
addopts = -m "not golden and not eval and not live"
